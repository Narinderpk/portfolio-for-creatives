<!doctype html>
<html lang="en">
  <head>
    <title>Page Not Found | Narinder Kaur</title>
    <meta name="description" content="Sorry, this page could not be found." />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/svg+xml"
      href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="42">♥</text></svg>'
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Eczar:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    />

    <style>
      html {
        box-sizing: border-box;
      }

      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(
            circle at top,
            rgba(255, 255, 255, 0.88) 0%,
            rgba(255, 255, 255, 0) 36%
          ),
          linear-gradient(180deg, #f9f2f6 0%, #f4dfe8 55%, #efcfdd 100%);
        color: #2a2a2a;
        position: relative;
      }

      .error-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        z-index: 2;
      }

      .sparkles {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
      }

      .sparkle {
        position: absolute;
        bottom: -2rem;
        width: 0.4rem;
        height: 0.4rem;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        box-shadow:
          0 0 0.7rem rgba(255, 255, 255, 0.95),
          0 0 1.4rem rgba(255, 214, 230, 0.8);
        animation: glitterRise linear infinite;
        opacity: 0;
      }

      .sparkle::before,
      .sparkle::after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.95);
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 999rem;
      }

      .sparkle::before {
        width: 0.08rem;
        height: 0.7rem;
      }

      .sparkle::after {
        width: 0.7rem;
        height: 0.08rem;
      }

      .s1 {
        left: 6%;
        animation-duration: 6s;
        animation-delay: 0.2s;
      }

      .s2 {
        left: 14%;
        animation-duration: 7s;
        animation-delay: 1.2s;
      }

      .s3 {
        left: 22%;
        animation-duration: 5.8s;
        animation-delay: 2.1s;
      }

      .s4 {
        left: 31%;
        animation-duration: 8s;
        animation-delay: 0.7s;
      }

      .s5 {
        left: 40%;
        animation-duration: 6.5s;
        animation-delay: 1.8s;
      }

      .s6 {
        left: 49%;
        animation-duration: 7.8s;
        animation-delay: 2.6s;
      }

      .s7 {
        left: 58%;
        animation-duration: 5.9s;
        animation-delay: 0.9s;
      }

      .s8 {
        left: 66%;
        animation-duration: 7.1s;
        animation-delay: 2.4s;
      }

      .s9 {
        left: 74%;
        animation-duration: 6.2s;
        animation-delay: 1.1s;
      }

      .s10 {
        left: 82%;
        animation-duration: 7.6s;
        animation-delay: 2.2s;
      }

      .s11 {
        left: 89%;
        animation-duration: 5.7s;
        animation-delay: 0.4s;
      }

      .s12 {
        left: 95%;
        animation-duration: 6.9s;
        animation-delay: 1.7s;
      }

      .error-header {
        width: min(75rem, 92%);
        margin: 0 auto;
        padding-top: 1.5rem;
      }

      .error-nav {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
      }

      .error-back {
        justify-self: start;
        color: #4f474a;
        text-decoration: none;
        font-size: 1rem;
      }

      .error-back:hover {
        color: #1f1c1d;
      }

      .error-about {
        justify-self: end;
        color: #4f474a;
        text-decoration: none;
        font-size: 1rem;
      }

      .error-about:hover {
        color: #1f1c1d;
      }

      .error-logo {
        justify-self: center;
        width: 3rem;
        height: 3rem;
        border-radius: 999rem;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.6);
        border: 0.063rem solid rgba(183, 123, 147, 0.18);
        color: #222;
        text-decoration: none;
      }

      .error-logo i {
        font-size: 1rem;
      }

      .error-main {
        flex: 1;
        width: min(60rem, 92%);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        z-index: 2;
      }

      .error-content {
        max-width: 46rem;
      }

      .error-kicker {
        font-size: 0.9rem;
        letter-spacing: 0.18em;
        color: #d6a8c9;
        margin-bottom: 1rem;
        text-transform: uppercase;
      }

      .error-title {
        font-family: "Eczar", serif;
        font-style: italic;
        font-size: clamp(3rem, 8vw, 6rem);
        line-height: 0.95;
        letter-spacing: -0.03em;
        color: #b07a8f;
        margin-bottom: 1rem;
      }

      .error-text {
        font-size: 1.15rem;
        line-height: 1.75;
        color: #555;
        max-width: 36rem;
        margin: 0 auto 1.75rem;
      }

      .error-actions {
        display: flex;
        justify-content: center;
      }

      .error-button {
        display: inline-block;
        padding: 0.9rem 1.3rem;
        border: 0.063rem solid #d8c8cf;
        border-radius: 999rem;
        background: #fff;
        color: #222;
        text-decoration: none;
        letter-spacing: 0.08em;
        font-size: 0.85rem;
        transition:
          transform 0.25s ease,
          background 0.25s ease;
      }

      .error-button:hover {
        transform: translateY(-0.08rem);
        background: #f8f3f5;
      }

      .error-footer {
        padding: 1.5rem 1rem 2rem;
        text-align: center;
        position: relative;
        z-index: 2;
      }

      .error-footer p {
        margin: 0;
        font-size: 0.9rem;
        color: #5d5558;
      }

      @keyframes glitterRise {
        0% {
          transform: translateY(0) scale(0.7);
          opacity: 0;
        }

        15% {
          opacity: 0.9;
        }

        50% {
          transform: translateY(-35vh) scale(1);
          opacity: 1;
        }

        100% {
          transform: translateY(-85vh) scale(0.5);
          opacity: 0;
        }
      }

      @media (max-width: 48rem) {
        .error-nav {
          grid-template-columns: 1fr auto 1fr;
          gap: 0.5rem;
        }

        .error-back,
        .error-about {
          font-size: 0.9rem;
        }

        .error-text {
          font-size: 1rem;
        }

        .error-footer p {
          font-size: 0.8rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="sparkles" aria-hidden="true">
      <span class="sparkle s1"></span>
      <span class="sparkle s2"></span>
      <span class="sparkle s3"></span>
      <span class="sparkle s4"></span>
      <span class="sparkle s5"></span>
      <span class="sparkle s6"></span>
      <span class="sparkle s7"></span>
      <span class="sparkle s8"></span>
      <span class="sparkle s9"></span>
      <span class="sparkle s10"></span>
      <span class="sparkle s11"></span>
      <span class="sparkle s12"></span>
    </div>

    <div class="error-page">
      <header class="error-header">
        <nav class="error-nav">
          <a href="work.html" class="error-back">← Back to Work</a>
          <a href="work.html" class="error-logo" aria-label="Homepage">
            <i class="fa-solid fa-heart"></i>
          </a>
          <a href="about.html" class="error-about">About</a>
        </nav>
      </header>

      <main class="error-main">
        <div class="error-content">
          <p class="error-kicker">404 Error</p>
          <h1 class="error-title">Page Not Found</h1>
          <p class="error-text">
            The page you’re looking for doesn’t exist, was moved, or the link
            may be broken.
          </p>
          <div class="error-actions">
            <a href="work.html" class="error-button">Return Home</a>
          </div>
        </div>
      </main>

      <footer class="error-footer">
        <p>© 2026 Narinder Kaur</p>
      </footer>
    </div>
  </body>
</html>
