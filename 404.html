  <head>
    <title>Page Not Found | Narinder Kaur</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/svg+xml"
      href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="42">♥</text></svg>'
    />

    <link

    <link

      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"

    <link

    <style>
      html {
        box-sizing: border-box;
      }

      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(
            circle at top,
            rgba(255, 255, 255, 0.94) 0%,
            rgba(255, 255, 255, 0) 36%
          ),
          linear-gradient(180deg, #faf8fb 0%, #f4f0f6 56%, #eceaf2 100%);
        color: #2a2a2a;
        position: relative;
      }

      .error-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        z-index: 2;
      }

      .bubble-field {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
      }

      .bubble {
        position: absolute;
        top: 0;
        left: 0;
        width: min(var(--bubble-size), 34vw);
        aspect-ratio: 1;
        border: 1px solid rgba(255, 255, 255, 0.62);
        border-radius: 50%;
        background:
        radial-gradient(
          ellipse at 31% 22%,
          rgba(255, 255, 255, 0.72) 0%,
          rgba(255, 255, 255, 0.28) 4%,
          transparent 19%
        ),
        radial-gradient(
          ellipse at 75% 76%,
          rgba(153, 217, 240, 0.15) 0%,
          transparent 32%
        ),
        radial-gradient(
          ellipse at 24% 77%,
          rgba(225, 165, 220, 0.15) 0%,
          transparent 34%
        ),
        radial-gradient(
          circle at 50% 50%,
          transparent 57%,
          rgba(255, 255, 255, 0.07) 69%,
          rgba(255, 255, 255, 0.24) 95%,
          rgba(255, 255, 255, 0.06) 100%
        );
        box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.38),
        inset -0.65rem -0.9rem 1.2rem rgba(131, 169, 207, 0.1),
        0 0.45rem 1.4rem rgba(102, 123, 158, 0.12);
        opacity: 0;
        will-change: transform;
      }

      .bubble::before,
      .bubble::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }

      .bubble::before {
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from var(--bubble-rotation),
          rgba(255, 255, 255, 0.42),
          rgba(164, 220, 255, 0.3) 14%,
          rgba(213, 182, 255, 0.32) 29%,
          rgba(255, 218, 180, 0.3) 44%,
          rgba(177, 238, 225, 0.32) 60%,
          rgba(255, 255, 255, 0.45) 76%,
          rgba(181, 211, 255, 0.3) 90%,
          rgba(255, 255, 255, 0.42)
        );
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 0.55rem),
          #000 calc(100% - 0.3rem)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 0.55rem),
          #000 calc(100% - 0.3rem)
        );
        opacity: 0.84;
      }

      .bubble::after {
        top: 13%;
        left: 17%;
        width: 34%;
        height: 12%;
        border-radius: 50%;
        background: radial-gradient(
          ellipse,
          rgba(255, 255, 255, 0.78) 0%,
          rgba(255, 255, 255, 0.32) 44%,
          transparent 100%
        );
        filter: blur(1px);
        transform: rotate(-32deg);
      }
      .error-header {
        width: min(75rem, 92%);
        margin: 0 auto;
        padding-top: 1.5rem;
      }

      .error-nav {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
      }

      .error-back {
        justify-self: start;
        color: #4f474a;
        text-decoration: none;
        font-size: 1rem;
      }

      .error-back:hover {
        color: #1f1c1d;
      }

      .error-about {
        justify-self: end;
        color: #4f474a;
        text-decoration: none;
        font-size: 1rem;
      }

      .error-about:hover {
        color: #1f1c1d;
      }

      .error-logo {
        justify-self: center;
        width: 3rem;
        height: 3rem;
        border-radius: 999rem;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.6);
        border: 0.063rem solid rgba(183, 123, 147, 0.18);
        color: #222;
        text-decoration: none;
      }

      .error-logo i {
        font-size: 1rem;
      }

      .error-main {
        flex: 1;
        width: min(60rem, 92%);
        margin: 0 auto;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        text-align: center;
        position: relative;
        z-index: 2;
        padding-top: clamp(2rem, 8vh, 6rem);
      }

      .error-content {
        max-width: 46rem;
        position: relative;
        isolation: isolate;
      }

      .error-content::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: -1.5rem -2rem;
        border: 1px solid rgba(255, 255, 255, 0.52);
        border-radius: 2rem;
        background: rgba(250, 248, 251, 0.24);
        backdrop-filter: blur(8px);
        pointer-events: none;
      }

      .error-kicker {
        font-size: 0.9rem;
        letter-spacing: 0.18em;
        color: #d6a8c9;
        margin-bottom: 1rem;
        text-transform: uppercase;
      }

      .error-title {
        font-family: "Eczar", serif;
        font-style: italic;
        font-size: clamp(3rem, 8vw, 6rem);
        line-height: 0.95;
        letter-spacing: -0.03em;
        color: #b07a8f;
        margin-bottom: 1rem;
      }

      .error-text {
        font-size: 1.15rem;
        line-height: 1.75;
        color: #555;
        max-width: 36rem;
        margin: 0 auto 1.75rem;
      }

      .error-actions {
        display: flex;
        justify-content: center;
      }

      .error-button {
        display: inline-block;
        padding: 0.9rem 1.3rem;
        border: 0.063rem solid #d8c8cf;
        border-radius: 999rem;
        background: #fff;
        color: #222;
        text-decoration: none;
        letter-spacing: 0.08em;
        font-size: 0.85rem;
        transition:
          transform 0.25s ease,
          background 0.25s ease;
      }

      .error-button:hover {
        transform: translateY(-0.08rem);
        background: #f8f3f5;
      }

      .error-footer {
        padding: 1.5rem 1rem 2rem;
        text-align: center;
        position: relative;
        z-index: 2;
      }

      .error-footer p {
        margin: 0;
        font-size: 0.9rem;
        color: #5d5558;
      }

      @media (max-width: 48rem) {
        .error-content::before {
          inset: -1rem -0.5rem;
        }

        .error-nav {
          grid-template-columns: 1fr auto 1fr;
          gap: 0.5rem;
        }

        .error-back,
        .error-about {
          font-size: 0.9rem;
        }

        .error-text {
          font-size: 1rem;
        }

        .error-footer p {
          font-size: 0.8rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="bubble-field" aria-hidden="true"></div>

    <div class="error-page">
      <header class="error-header">
        <nav class="error-nav">
          <a href="work.html" class="error-back">← Back to Work</a>
          <a href="work.html" class="error-logo" aria-label="Homepage">
            <i class="fa-solid fa-heart"></i>
          </a>
          <a href="about.html" class="error-about">About</a>
        </nav>
      </header>

      <main class="error-main">
        <div class="error-content">
          <p class="error-kicker">404 Error</p>
          <h1 class="error-title">Page Not Found</h1>
          <p class="error-text">
            The page you’re looking for doesn’t exist, was moved, or the link
            may be broken.
          </p>
          <div class="error-actions">
            <a href="work.html" class="error-button">Return Home</a>
          </div>
        </div>
      </main>

      <footer class="error-footer">
        <p>© 2026 Narinder Zaildar</p>
      </footer>
    </div>

    <script>
      const bubbleField = document.querySelector(".bubble-field");
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      );
      const bubbleSizes = [
        150, 190, 112, 170, 210, 128, 184, 156, 104, 198, 138, 164,
        220, 118, 176, 188, 110, 160, 206, 132, 180, 100, 152, 194,
      ];
      const bubbles = bubbleSizes.map((size, index) => {
        const element = document.createElement("span");
        element.className = "bubble";
        element.style.setProperty("--bubble-size", `${size}px`);
        element.style.setProperty(
          "--bubble-rotation",
          `${(index * 47) % 360}deg`,
        );
        bubbleField.append(element);

        return {
          element,
          index,
          x: 0,
          y: 0,
          vx: 0,
          vy: 0,
          age: 0,
          lifetime: 0,
          opacity: 0,
          active: false,
        };
      });

      const center = () => ({ x: innerWidth / 2, y: innerHeight / 2 });
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));
      const initialBubbleCount = 14;
      const trailSpacing = 132;
      const maxFrameTime = 32;
      let pointer = null;
      let lastTrailPoint = null;
      let trailDistance = 0;
      let bubbleCursor = initialBubbleCount;
      let animationFrame = 0;
      let previousFrameTime = 0;

      function renderBubble(bubble) {
        bubble.element.style.transform =
          `translate3d(${bubble.x}px, ${bubble.y}px, 0) ` +
          "translate(-50%, -50%)";
        bubble.element.style.opacity = String(bubble.opacity);
      }

      function placeInitialBubbles() {
        const origin = center();

        bubbles.forEach((bubble, index) => {
          const angle = index * goldenAngle;
          const radius = 12 + (index % 5) * 12;
          bubble.x = origin.x + Math.cos(angle) * radius;
          bubble.y = origin.y + Math.sin(angle) * radius;
          bubble.opacity = index < initialBubbleCount ? 0.62 : 0;
          bubble.active = false;
          renderBubble(bubble);
        });
      }

      function activateBubble(bubble, x, y, vx, vy) {
        bubble.x = x;
        bubble.y = y;
        bubble.vx = vx;
        bubble.vy = vy;
        bubble.age = 0;
        bubble.lifetime = 5200 + (bubble.index % 5) * 420;
        bubble.opacity = 0.76 + (bubble.index % 3) * 0.07;
        bubble.active = true;
        renderBubble(bubble);
      }

      function getReusableBubble() {
        for (let offset = 0; offset < bubbles.length; offset += 1) {
          const index = (bubbleCursor + offset) % bubbles.length;
          if (!bubbles[index].active) {
            bubbleCursor = (index + 1) % bubbles.length;
            return bubbles[index];
          }
        }

        const oldest = bubbles.reduce((candidate, bubble) =>
          bubble.age > candidate.age ? bubble : candidate,
        );
        bubbleCursor = (oldest.index + 1) % bubbles.length;
        return oldest;
      }

      function burstInitialBubbles(directionX, directionY) {
        const origin = center();

        bubbles.slice(0, initialBubbleCount).forEach((bubble, index) => {
          const angle = index * goldenAngle;
          const spread = 1.2 + (index % 5) * 0.7;
          const offset = 8 + (index % 4) * 9;

          activateBubble(
            bubble,
            origin.x + Math.cos(angle) * offset,
            origin.y + Math.sin(angle) * offset,
            Math.cos(angle) * spread + directionX * 1.4,
            Math.sin(angle) * spread + directionY * 1.4 - 0.3,
          );
        });
      }

      function emitTrailBubble(x, y, directionX, directionY) {
        const bubble = getReusableBubble();
        const side = bubble.index % 2 ? 1 : -1;
        const wobble = ((bubble.index * 13) % 9 - 4) * 0.22;

        activateBubble(
          bubble,
          x,
          y,
          directionX * 0.38 - directionY * side * 0.28 + wobble * 0.4,
          directionY * 0.38 + directionX * side * 0.28 - 0.18,
        );
      }

      function emitAlongPointerPath(from, to, distance) {
        const deltaX = to.x - from.x;
        const deltaY = to.y - from.y;
        const length = Math.hypot(deltaX, deltaY);

        if (!length) {
          return;
        }

        const directionX = deltaX / length;
        const directionY = deltaY / length;
        let traveled = trailSpacing - trailDistance;

        while (traveled <= length) {
          const progress = traveled / length;
          emitTrailBubble(
            from.x + deltaX * progress,
            from.y + deltaY * progress,
            directionX,
            directionY,
          );
          traveled += trailSpacing;
        }

        trailDistance = (trailDistance + distance) % trailSpacing;
      }

      function animate(timestamp) {
        animationFrame = 0;
        const elapsed = previousFrameTime
          ? Math.min(timestamp - previousFrameTime, maxFrameTime)
          : 16;
        const frameScale = elapsed / 16.67;
        previousFrameTime = timestamp;
        let stillMoving = false;

        bubbles.forEach((bubble) => {
          if (!bubble.active) {
            return;
          }

          bubble.age += elapsed;
          bubble.x += bubble.vx * frameScale;
          bubble.y += bubble.vy * frameScale;
          bubble.vy -= 0.006 * frameScale;

          if (bubble.age >= bubble.lifetime) {
            bubble.active = false;
            bubble.opacity = 0;
          } else {
            const fadeOut = Math.min(
              1,
              (bubble.lifetime - bubble.age) / 1300,
            );
            bubble.opacity = (0.76 + (bubble.index % 3) * 0.07) * fadeOut;
            stillMoving = true;
          }

          renderBubble(bubble);
        });

        if (stillMoving) {
          animationFrame = window.requestAnimationFrame(animate);
        } else {
          previousFrameTime = 0;
        }
      }

      function scheduleAnimation() {
        if (!animationFrame) {
          animationFrame = window.requestAnimationFrame(animate);
        }
      }

      function handlePointerMove(event) {
        if (event.pointerType === "touch" || reducedMotion.matches) {
          return;
        }

        const nextPointer = { x: event.clientX, y: event.clientY };

        if (!pointer) {
          pointer = nextPointer;
          lastTrailPoint = nextPointer;
          const origin = center();
          const directionX = nextPointer.x - origin.x;
          const directionY = nextPointer.y - origin.y;
          const length = Math.hypot(directionX, directionY) || 1;
          burstInitialBubbles(directionX / length, directionY / length);
          scheduleAnimation();
          return;
        }

        const distance = Math.hypot(
          nextPointer.x - lastTrailPoint.x,
          nextPointer.y - lastTrailPoint.y,
        );

        if (distance > 0) {
          emitAlongPointerPath(lastTrailPoint, nextPointer, distance);
          lastTrailPoint = nextPointer;
          scheduleAnimation();
        }

        pointer = nextPointer;
      }

      placeInitialBubbles();
      window.addEventListener("pointermove", handlePointerMove);
      reducedMotion.addEventListener("change", () => {
        if (reducedMotion.matches) {
          window.cancelAnimationFrame(animationFrame);
          animationFrame = 0;
          pointer = null;
          lastTrailPoint = null;
          trailDistance = 0;
          placeInitialBubbles();
        }
      });
      window.addEventListener("resize", () => {
        if (!pointer || reducedMotion.matches) {
          placeInitialBubbles();
          return;
        }

        bubbles.forEach((bubble) => {
          bubble.x = Math.min(bubble.x, innerWidth);
          bubble.y = Math.min(bubble.y, innerHeight);
          renderBubble(bubble);
        });
      });
    </script>
  </body>
</html>
